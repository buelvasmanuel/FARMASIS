spring.config.import=optional:classpath:application-secrets.properties
spring.application.name=adminlfarma-mini


spring.datasource.url=jdbc:mysql://localhost:3306/l_farma?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# Server Configuration
server.port=8092
spring.web.error.include-message=always
spring.web.error.include-stacktrace=always

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=l_farma

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Jackson Configuration
spring.jackson.time-zone=America/Lima

# Logging Configuration
