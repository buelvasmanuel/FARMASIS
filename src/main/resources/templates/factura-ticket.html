<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket de Venta | L-Farma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <script>(function(){try{if(localStorage.getItem('sidebarState')==='closed'){document.documentElement.classList.add('sidebar-preload-collapsed');}}catch(e){}}());</script>
    <style>
        body { background-color: #ffffff; }
        
        .ticket-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem 0;
            min-height: calc(100vh - 60px);
        }

        #zona-ticket {
            width: 80mm;
            background-color: white;
            padding: 10mm 5mm;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            color: #000;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
        }

        .ticket-header {
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 1px dashed #000;
            padding-bottom: 10px;
        }

        .ticket-logo {
            font-size: 20px;
            font-weight: bold;
            display: block;
            text-transform: uppercase;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
        }

        .ticket-table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
        }

        .ticket-table th {
            border-bottom: 1px solid #000;
            text-align: left;
            padding: 5px 0;
        }

        .ticket-table td {
            padding: 5px 0;
            vertical-align: top;
        }

        .ticket-totals {
            border-top: 1px dashed #000;
            padding-top: 10px;
        }

        .total-bold {
            font-size: 14px;
            font-weight: bold;
        }

        .ticket-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 10px;
            border-top: 1px dashed #ccc;
            padding-top: 10px;
        }

        /* PRINT STYLES */
        @media print {
            body * { visibility: hidden; }
            #zona-ticket, #zona-ticket * { visibility: visible; }
            #zona-ticket {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%; /* El navegador ajustará al ancho del papel */
                box-shadow: none;
                margin: 0;
                padding: 0;
            }
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar('ventas')}"></div>
    <div th:replace="~{fragments/sidebar :: topbar}"></div>
    <div th:replace="~{fragments/sidebar :: logoutModal}"></div>

    <div class="main-content no-transition" id="mainContent">
        <div class="container-fluid py-3 no-print border-bottom bg-white d-flex align-items-center gap-2">
            <button type="button" onclick="window.history.length > 1 ? window.history.back() : window.location.href='/ventas';" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Volver a Ventas</button>
            <a th:href="@{/ventas/nueva}" class="btn btn-success btn-sm">
                <i class="bi bi-plus-lg"></i> Nueva Venta
            </a>
            <button class="btn btn-primary btn-sm" onclick="window.print()">
                <i class="bi bi-printer"></i> Imprimir Ticket
            </button>
        </div>

        <main class="content-wrapper container-fluid px-4 py-3">
            <div class="ticket-wrapper">
                <div id="zona-ticket">
                    <div class="ticket-header">
                        <span class="ticket-logo" th:text="${config.nombreFarmacia}">FARMASIS</span>
                        <p class="mb-0">
                            <span th:text="${config.nit}">NIT: 123456</span><br>
                            <span th:text="${config.direccion}">Dirección</span><br>
                            <span th:text="'Tel: ' + ${config.telefono}">Tel: 000</span>
                        </p>
                    </div>

                    <div class="info-header mb-3">
                        <div class="info-row">
                            <span>FACTURA:</span>
                            <span th:text="${factura.numeroFactura}">FAC-000</span>
                        </div>
                        <div class="info-row">
                            <span>FECHA:</span>
                            <span th:text="${#temporals.format(factura.fecha, 'dd/MM/yyyy HH:mm')}">01/01/2026</span>
                        </div>
                        <div class="info-row">
                            <span>CLIENTE:</span>
                            <span th:text="${factura.clienteNombre}">Cliente</span>
                        </div>
                    </div>

                    <table class="ticket-table">
                        <thead>
                            <tr>
                                <th>DESCRIPCIÓN</th>
                                <th style="text-align: center;">CANT</th>
                                <th style="text-align: right;">TOTAL</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="d : ${factura.detalles}">
                                <td>
                                    <span th:text="${d.productoNombre}">Producto</span><br>
                                    <small th:text="'Cod: ' + ${d.productoCodigo}"></small>
                                </td>
                                <td style="text-align: center;" th:text="${d.cantidad}">1</td>
                                <td style="text-align: right;" th:text="'$ ' + ${#numbers.formatDecimal(d.subtotal, 1, 'POINT', 0, 'COMMA')}">$ 0</td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="ticket-totals">
                        <div class="info-row">
                            <span>SUBTOTAL:</span>
                            <span th:text="'$ ' + ${#numbers.formatDecimal(factura.subtotal, 1, 'POINT', 0, 'COMMA')}">$ 0</span>
                        </div>
                        <div class="info-row">
                            <span>IVA (0%):</span>
                            <span>$ 0</span>
                        </div>
                        <div class="info-row total-bold mt-2">
                            <span>TOTAL:</span>
                            <span th:text="'$ ' + ${#numbers.formatDecimal(factura.total, 1, 'POINT', 0, 'COMMA')}">$ 0</span>
                        </div>
                    </div>

                    <div class="ticket-footer">
                        <p>¡GRACIAS POR SU COMPRA!<br>L-Farma - Su salud es nuestra prioridad<br><small>Desarrollado por Farmasis</small></p>
                        <p th:if="${factura.observaciones != null and !factura.observaciones.empty}">
                            <strong>Nota:</strong> <span th:text="${factura.observaciones}"></span>
                        </p>
                    </div>
                </div>
            </div>
            </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/js/sidebar.js"></script>
</body>
</html>
