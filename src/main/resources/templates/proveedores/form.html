<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - L-Farma'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/sidebar.css">
    <script>(function(){try{if(localStorage.getItem('sidebarState')==='closed'){document.documentElement.classList.add('sidebar-preload-collapsed');}}catch(e){}}());</script>
    <style>
        html.sidebar-preload-collapsed .sidebar { width: 70px; min-width: 70px; }
        html.sidebar-preload-collapsed .sidebar .sidebar-text,
        html.sidebar-preload-collapsed .sidebar .nav-label,
        html.sidebar-preload-collapsed .sidebar .logo-text,
        html.sidebar-preload-collapsed .sidebar .sidebar-footer { display: none; }
        html.sidebar-preload-collapsed .main-content { margin-left: 70px; }

        * { font-family: 'Inter', sans-serif; }
        body { background-color: #ffffff; }
    </style>
</head>

<body>
    <div th:replace="~{fragments/sidebar :: sidebar('proveedores')}"></div>
    <div th:replace="~{fragments/sidebar :: topbar}"></div>
    <div th:replace="~{fragments/sidebar :: logoutModal}"></div>

    <div class="main-content no-transition" id="mainContent">
        <main class="content-wrapper container-fluid px-4 py-3">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="fw-bold"><i class="bi bi-truck me-2" style="color: var(--secondary-color);"></i> <span th:text="${titulo}"></span></h1>
                <a href="/proveedores" class="btn btn-outline-lfarma"><i class="bi bi-arrow-left me-1"></i> Volver</a>
            </div>

            <div class="card p-4">
                <form th:action="@{${formAction}}" th:object="${proveedor}" method="post">

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold" style="font-size: 0.88rem;">Nombre *</label>
                            <input type="text" class="form-control" th:field="*{nombre}" 
                                   pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$" 
                                   title="El nombre solo puede contener letras y espacios." 
                                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''" required autofocus
                                   style="border-radius: 12px; padding: 11px 16px;">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold" style="font-size: 0.88rem;">Empresa *</label>
                            <input type="text" class="form-control" th:field="*{empresa}" 
                                   th:classappend="${#fields.hasErrors('empresa')} ? 'is-invalid' : ''" required
                                   style="border-radius: 12px; padding: 11px 16px;">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('empresa')}" th:errors="*{empresa}"></div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold" style="font-size: 0.88rem;">Teléfono *</label>
                            <input type="tel" class="form-control" th:field="*{telefono}" 
                                   pattern="^3[0-9]{9}$" maxlength="10" 
                                   oninput="this.value = this.value.replace(/[^0-9]/g, '')" 
                                   title="El número debe tener 10 dígitos y empezar por 3" 
                                   th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid' : ''" required
                                   style="border-radius: 12px; padding: 11px 16px;">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold" style="font-size: 0.88rem;">Email *</label>
                            <input type="email" class="form-control" th:field="*{email}" 
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" required
                                   style="border-radius: 12px; padding: 11px 16px;">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold" style="font-size: 0.88rem;">Dirección</label>
                        <textarea class="form-control" th:field="*{direccion}" rows="2" style="border-radius: 12px; padding: 11px 16px;"></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold" style="font-size: 0.88rem;">Tipo de productos</label>
                        <select class="form-select" th:field="*{tipoProductos}" style="border-radius: 12px; padding: 11px 16px;">
                            <option value="">Seleccionar tipo...</option>
                            <option value="Cosméticos">Cosméticos</option>
                            <option value="Higiene">Higiene</option>
                            <option value="Medicamentos">Medicamentos</option>
                            <option value="Suplementos">Suplementos</option>
                            <option value="Otros">Otros</option>
                        </select>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-lfarma btn-lg">
                            <i class="bi bi-save me-2"></i> Guardar Proveedor
                        </button>
                    </div>
                </form>
            </div>
            </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/sidebar.js"></script>
</body>

</html>
