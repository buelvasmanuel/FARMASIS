<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - Proveedores'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <script>(function(){try{if(localStorage.getItem('sidebarState')==='closed'){document.documentElement.classList.add('sidebar-preload-collapsed');}}catch(e){}}());</script>
    <style>
        html.sidebar-preload-collapsed .sidebar { width: 70px; min-width: 70px; }
        html.sidebar-preload-collapsed .sidebar .sidebar-text,
        html.sidebar-preload-collapsed .sidebar .nav-label,
        html.sidebar-preload-collapsed .sidebar .logo-text { display: none; }
        html.sidebar-preload-collapsed .main-content { margin-left: 70px; }

        body {
            background-color: #f0f2f5;
        }
    </style>
</head>

<body>
    <!-- Sidebar -->
    <div class="sidebar no-transition" id="sidebar">
        <div class="sidebar-header d-flex justify-content-between align-items-center">
            <div class="logo">
                <i class="bi bi-shield-shielded"></i>
                <span class="logo-text"> Owner</span>
            </div>
            <button class="toggle-btn" onclick="toggleSidebar()">
                <i class="bi bi-chevron-left"></i>
            </button>
        </div>

        <ul class="nav-menu">
            <li class="nav-item">
                <a href="/owner/dashboard" class="nav-link">
                    <i class="bi bi-speedometer2"></i>
                    <span class="sidebar-text">Dashboard</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="/owner/gestionar-usuarios" class="nav-link">
                    <i class="bi bi-people"></i>
                    <span class="sidebar-text">Gestión de Usuarios</span>
                </a>
            </li>

            <li class="nav-item">
                <a href="/proveedores" class="nav-link">
                    <i class="bi bi-truck"></i>
                    <span class="sidebar-text">Proveedores</span>
                </a>
            </li>
            <li class="nav-item"><a href="/productos" class="nav-link"><i class="bi bi-box-seam"></i><span
                        class="sidebar-text">Productos</span></a></li>
            <li class="nav-item"><a href="/ventas" class="nav-link"><i class="bi bi-receipt"></i><span
                        class="sidebar-text">Ventas</span></a></li>
            <li class="nav-item"><a href="/ventas/nueva" class="nav-link"><i class="bi bi-cart-plus"></i><span
                        class="sidebar-text">Nueva Venta</span></a></li>
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <i class="bi bi-gear"></i>
                    <span class="sidebar-text">Configuración</span>
                </a>
            </li>
            <li class="nav-item">
                <button type="button" id="logoutTrigger" class="nav-link w-100 text-start" style="background: none; border: none; cursor: pointer;">
                    <i class="bi bi-box-arrow-right"></i>
                    <span class="sidebar-text">Cerrar Sesión</span>
                </button>
            </li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content no-transition" id="mainContent">
        <div class="top-bar">
            <button class="btn btn-light" id="mobileToggle" style="display: none;"><i class="bi bi-list"></i></button>
            <div><i class="bi bi-person-circle fs-4 me-2"></i><span><strong
                        th:text="${#authentication.name}"></strong></span></div>
        </div>

        <div class="content-wrapper">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1><i class="bi bi-truck"></i> <span th:text="${titulo}"></span></h1>
                <a href="/proveedores" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
            </div>

            <div class="card">
                <div class="card-body">
                    <form th:action="@{${formAction}}" th:object="${proveedor}" method="post">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nombre *</label>
                                <input type="text" class="form-control" th:field="*{nombre}" 
                                       pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$" 
                                       title="El nombre solo puede contener letras y espacios. No se permiten números ni caracteres especiales." 
                                       th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''" required autofocus>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Empresa *</label>
                                <input type="text" class="form-control" th:field="*{empresa}" 
                                       th:classappend="${#fields.hasErrors('empresa')} ? 'is-invalid' : ''" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('empresa')}" th:errors="*{empresa}"></div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Teléfono *</label>
                                <input type="tel" class="form-control" th:field="*{telefono}" 
                                       pattern="^3[0-9]{9}$" maxlength="10" 
                                       oninput="this.value = this.value.replace(/[^0-9]/g, '')" 
                                       title="El número debe tener 10 dígitos y empezar por 3" 
                                       th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid' : ''" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email *</label>
                                <input type="email" class="form-control" th:field="*{email}" 
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Dirección</label>
                            <textarea class="form-control" th:field="*{direccion}" rows="2"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Tipo de productos</label>
                            <select class="form-select" th:field="*{tipoProductos}">
                                <option value="">Seleccionar tipo...</option>
                                <option value="Medicamentos">Medicamentos</option>
                                <option value="Insumos médicos">Insumos médicos</option>
                                <option value="Equipos médicos">Equipos médicos</option>
                                <option value="Productos naturales">Productos naturales</option>
                                <option value="Cosméticos">Cosméticos</option>
                                <option value="Otros">Otros</option>
                            </select>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-save"></i> Guardar Proveedor
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Logout Modal -->
    <div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="logoutModalLabel"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <i class="bi bi-exclamation-triangle-fill logout-icon"></i>
                    <p>¿Estás seguro que quieres cerrar sesión?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-logout-cancel" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-logout-confirm" id="logoutConfirmBtn">
                        <i class="bi bi-check-lg"></i> Sí, cerrar sesión
                    </button>
                </div>
            </div>
        </div>
    </div>
    <form id="logoutForm" th:action="@{/logout}" method="post" style="display:none;"></form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/sidebar.js"></script>
</body>

</html>
