<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedores - L-Farma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/sidebar.css">
    <script>(function(){try{if(localStorage.getItem('sidebarState')==='closed'){document.documentElement.classList.add('sidebar-preload-collapsed');}}catch(e){}}());</script>
    <style>

        body { background-color: #ffffff; }

        .card-hover { transition: transform 0.3s, box-shadow 0.3s; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: var(--card-hover-shadow); }
    </style>
</head>

<body>
    <div th:replace="~{fragments/sidebar :: sidebar('proveedores')}"></div>
    <div th:replace="~{fragments/sidebar :: topbar}"></div>
    <div th:replace="~{fragments/sidebar :: logoutModal}"></div>

    <div class="main-content no-transition" id="mainContent">
        <div class="container-fluid px-4 py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="fw-bold"><i class="bi bi-truck me-2" style="color: var(--secondary-color);"></i> Proveedores</h1>
                <a href="/proveedores/nuevo" class="btn btn-lfarma"><i class="bi bi-plus-circle me-1"></i> Nuevo Proveedor</a>
            </div>

            <!-- Alertas -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" style="border-radius: 12px;">
                <i class="bi bi-check-circle me-1"></i> <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" style="border-radius: 12px;">
                <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Buscador -->
            <div class="card mb-4">
                <div class="card-body">
                    <form method="get" class="row g-3">
                        <div class="col-md-10">
                            <input type="text" class="form-control" name="search"
                                placeholder="Buscar por nombre, empresa o tipo de producto..." th:value="${searchTerm}"
                                style="border-radius: 12px; padding: 11px 16px;">
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100" style="border-radius: 12px; padding: 11px;">
                                <i class="bi bi-search"></i> Buscar
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Estadísticas -->
            <div class="stat-card mb-4 d-flex align-items-center gap-3" style="padding: 16px 22px;">
                <i class="bi bi-info-circle" style="color: var(--secondary-color); font-size: 1.3rem;"></i>
                <span>Total de proveedores: <strong th:text="${totalProveedores}">0</strong></span>
            </div>

            <!-- Grid de Proveedores -->
            <div class="row">
                <div class="col-md-12 mb-3" th:if="${proveedores.empty}">
                    <div class="card text-center py-5">
                        <div class="card-body">
                            <i class="bi bi-inbox" style="font-size: 3rem; color: var(--text-muted);"></i>
                            <h5 class="mt-3 text-muted">No hay proveedores registrados</h5>
                            <a href="/proveedores/nuevo" class="btn btn-lfarma mt-2">Crear primer proveedor</a>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 col-lg-4 mb-4" th:each="proveedor : ${proveedores}">
                    <div class="card h-100 card-hover">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <h5 class="card-title mb-0">
                                    <i class="bi bi-building" style="color: var(--secondary-color);"></i>
                                    <strong th:text="${proveedor.nombre}"></strong>
                                </h5>
                                <span class="badge" style="background: var(--primary-color);" th:text="${proveedor.empresa}"></span>
                            </div>

                            <div class="mb-2">
                                <small class="text-muted">Teléfono:</small>
                                <div><i class="bi bi-telephone"></i> <span th:text="${proveedor.telefono}">-</span></div>
                            </div>

                            <div class="mb-2">
                                <small class="text-muted">Email:</small>
                                <div><i class="bi bi-envelope"></i> <span th:text="${proveedor.email}">-</span></div>
                            </div>

                            <div class="mb-2">
                                <small class="text-muted">Dirección:</small>
                                <div><i class="bi bi-geo-alt"></i> <span th:text="${proveedor.direccion}">-</span></div>
                            </div>

                            <div th:if="${proveedor.tipoProductos}">
                                <small class="text-muted">Tipo de productos:</small>
                                <div><span class="badge" style="background: var(--accent-color); color: var(--primary-color);" th:text="${proveedor.tipoProductos}"></span></div>
                            </div>
                        </div>
                        <div class="card-footer bg-transparent border-0 pb-3">
                            <div class="btn-group w-100">
                                <a th:href="@{/proveedores/editar/{id}(id=${proveedor.id})}"
                                    class="btn btn-outline-lfarma btn-sm">
                                    <i class="bi bi-pencil"></i> Editar
                                </a>
                                <button type="button" class="btn btn-outline-danger btn-sm" data-bs-toggle="modal"
                                    th:data-bs-target="'#eliminarModal' + ${proveedor.id}">
                                    <i class="bi bi-trash"></i> Eliminar
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Modal Eliminar -->
                    <div class="modal fade" th:id="'eliminarModal' + ${proveedor.id}" tabindex="-1">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content">
                                <div class="modal-header" style="background: linear-gradient(135deg, var(--dark-bg) 0%, var(--danger-color) 100%); color: white;">
                                    <h5 class="modal-title"><i class="bi bi-exclamation-triangle"></i> Confirmar Eliminación</h5>
                                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body text-center py-4">
                                    <i class="bi bi-trash" style="font-size: 2.5rem; color: var(--danger-color);"></i>
                                    <p class="mt-3">¿Estás seguro de que deseas eliminar al proveedor <strong th:text="${proveedor.nombre}"></strong>?</p>
                                    <p class="text-danger small">Esta acción no se puede deshacer.</p>
                                </div>
                                <div class="modal-footer border-0 justify-content-center gap-2">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                    <form th:action="@{/proveedores/eliminar/{id}(id=${proveedor.id})}" method="post" style="display: inline;">
                                        <button type="submit" class="btn btn-danger">Eliminar</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/sidebar.js"></script>
</body>

</html>
