<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero BI - L-Farma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/sidebar.css">
    <script>(function () { try { if (localStorage.getItem('sidebarState') === 'closed') { document.documentElement.classList.add('sidebar-preload-collapsed'); } } catch (e) { } }());</script>
    <style>
        body {
            background-color: #ffffff;
        }

        .bi-container {
            width: 100%;
            height: calc(100vh - 180px);
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            background-color: #f8f9fa;
            position: relative;
        }

        .bi-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/sidebar :: sidebar('bi')}"></div>
    <div th:replace="~{fragments/sidebar :: topbar}"></div>
    <div th:replace="~{fragments/sidebar :: logoutModal}"></div>

    <div class="main-content no-transition" id="mainContent">
        <div class="container-fluid px-4 py-4">
            <h1 class="mb-4 fw-bold"><i class="bi bi-bar-chart-fill me-2" style="color: var(--secondary-color);"></i>
                Tablero BI</h1>



            <div class="bi-container">
                <!-- AQUI VA EL LINK DE POWER BI -->
                <!-- Reemplazar el src="..." con el enlace real generado en Power BI al darle a "Publicar en la Web" o "Insertar" -->
                <iframe class="bi-iframe" title="Reporte de Ventas"
                    src="https://app.powerbi.com/view?r=eyJrIjoiMGU3MjYxMmUtOTA2Ni00MzcxLWExMTctYjM0NmQwOGI0OTAxIiwidCI6IjlkMTJiZjNmLWU0ZjYtNDdhYi05MTJmLTFhMmYwZmM0OGFhNCIsImMiOjR9"
                    frameborder="0" allowFullScreen="true">
                </iframe>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/js/sidebar.js"></script>
</body>

</html>
