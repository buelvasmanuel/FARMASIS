<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta - L-Farma</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/sidebar.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>(function(){try{if(localStorage.getItem('sidebarState')==='closed'){document.documentElement.classList.add('sidebar-preload-collapsed');}}catch(e){}}());</script>
    <style>
        body { background: #f8f9fa; font-family: 'Inter', sans-serif; }
        .pos-grid { display: grid; grid-template-columns: 1fr 380px; gap: 1.5rem; min-height: calc(100vh - 100px); }
        @media (max-width: 992px) { .pos-grid { grid-template-columns: 1fr; } }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }
        @media (min-width: 768px) {
            .product-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (min-width: 1200px) {
            .product-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .product-item {
            background: white;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .product-item:hover {
            border-color: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: var(--card-hover-shadow);
        }

        .product-item .product-img {
            width: 100%;
            height: 120px;
            object-fit: contain;
            margin-bottom: 10px;
            background: #f8fafc;
            border-radius: 8px;
            padding: 8px;
        }

        .product-item .product-code {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .product-item .product-name {
            font-weight: 600;
            font-size: 0.9rem;
            margin: 6px 0;
            color: var(--text-primary);
        }

        .product-item .product-price {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .product-item .product-stock {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .product-item.out-of-stock {
            opacity: 0.5;
            pointer-events: none;
        }

        /* Category Pills */
        .pill-container { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
        .pill { padding: 6px 16px; border-radius: 20px; border: 1.5px solid #dee2e6; background: white; color: #495057; font-size: 0.85rem; font-weight: 500; text-decoration: none; transition: all 0.2s; }
        .pill:hover { border-color: var(--primary-color); color: var(--primary-color); }
        .pill.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }

        /* Cart */
        .cart-panel { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); display: flex; flex-direction: column; position: sticky; top: 15px; height: calc(100vh - 30px); overflow-y: auto; }
        .cart-header { padding: 1.2rem 1.5rem; border-bottom: 1px solid #f1f3f5; }
        .cart-body { flex: 1; overflow-y: auto; padding: 1rem 1.5rem; }
        .cart-footer { padding: 1.2rem 1.5rem; border-top: 1px solid #f1f3f5; background: #fafafa; border-radius: 0 0 16px 16px; }
        .cart-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f8f9fa; }
        .cart-item-img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #e8f5e9; flex-shrink: 0; }
        .cart-item-info { flex: 1; min-width: 0; }
        .cart-item-name { font-weight: 600; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cart-item-price { font-size: 0.8rem; color: #6c757d; }
        .qty-control { display: flex; align-items: center; gap: 4px; }
        .qty-control button { width: 26px; height: 26px; border-radius: 6px; border: 1px solid #dee2e6; background: white; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .qty-control span { min-width: 20px; text-align: center; font-weight: 600; font-size: 0.85rem; }
        .btn-remove-item { background: none; border: none; color: #dc3545; cursor: pointer; padding: 4px; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar('nueva-venta')}"></div>
    <div th:replace="~{fragments/sidebar :: topbar}"></div>
    <div th:replace="~{fragments/sidebar :: logoutModal}"></div>

    <div class="main-content no-transition" id="mainContent">
        <div class="container-fluid px-4 py-3">
            <h4 class="fw-bold mb-3"><i class="bi bi-cart-plus" style="color: var(--secondary-color);"></i> Punto de Venta</h4>

            <div class="pos-grid">
                <!-- LEFT: Products -->
                <div>
                    <!-- Contenedor Sticky para Buscador y Categorías -->
                    <div style="position: sticky; top: 0; z-index: 1020; background: #f4f7f6; padding-bottom: 10px; padding-top: 10px;">
                        <!-- Search Input -->
                        <div class="mb-3">
                            <form th:action="@{/ventas/nueva}" method="get" id="searchForm" class="d-flex gap-2">
                                <input type="hidden" name="categoria" th:value="${categoriaActual}">
                                <input type="hidden" name="size" th:value="${pageSize}">
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0" style="border-radius: 10px 0 0 10px;"><i class="bi bi-search text-muted"></i></span>
                                    <input type="search" class="form-control border-start-0 border-end-0" id="searchProducts" name="search"
                                           th:value="${search}" placeholder="Buscar producto por nombre o código..." autocomplete="off">
                                    <button th:if="${search != null and !search.isEmpty()}" type="button" class="btn btn-outline-secondary border-start-0 border-end-0" onclick="clearSearch()"><i class="bi bi-x-lg"></i></button>
                                    <button type="submit" class="btn btn-primary" style="border-radius: 0 10px 10px 0;"><i class="bi bi-search"></i> Buscar</button>
                                </div>
                            </form>
                        </div>

                        <!-- Category Pills -->
                        <div class="pill-container mb-0">
                            <a class="pill" th:classappend="${categoriaActual == null || categoriaActual.isEmpty()} ? 'active'" th:href="@{/ventas/nueva(search=${search})}">Todos</a>
                            <a class="pill" th:each="cat : ${categorias}" th:classappend="${categoriaActual == cat} ? 'active'" th:href="@{/ventas/nueva(categoria=${cat}, search=${search})}" th:text="${cat}"></a>
                        </div>
                    </div>

                    <!-- Product Grid (Original L-Farma Layout) -->
                    <div class="product-grid" id="productGrid" style="margin-bottom: 2rem;">
                        <div th:each="p : ${productos}"
                             th:class="${p.cantidad == null || p.cantidad <= 0} ? 'product-item out-of-stock' : 'product-item'"
                             th:data-id="${p.id}" th:data-nombre="${p.nombre}" th:data-precio="${p.precio}"
                             th:data-stock="${p.cantidad}" th:data-codigo="${p.codigo}"
                             th:data-img="${p.imagenUrl}" onclick="addToCart(this)">
                            <img th:src="${p.imagenUrl != null and !p.imagenUrl.isEmpty() ? p.imagenUrl : 'https://via.placeholder.com/150?text=Sin+Imagen'}"
                                 class="product-img" alt="Imagen del producto">
                            <span class="product-code" th:text="'Cod: ' + ${p.codigo}">Cod: -</span>
                            <div class="product-name" th:text="${p.nombre}">Producto</div>
                            <div class="product-price"
                                 th:text="'$ ' + ${p.precio != null ? #numbers.formatDecimal(p.precio, 1, 'POINT', 0, 'COMMA') : '0'}">$ 0</div>
                            <div class="product-stock">
                                <span th:if="${p.cantidad != null and p.cantidad > 0}" th:text="'Stock: ' + ${p.cantidad}">Stock: 0</span>
                                <span th:if="${p.cantidad == null || p.cantidad <= 0}" class="text-danger">Agotado</span>
                            </div>
                        </div>
                    </div>
                    <div th:if="${productos.isEmpty() and (search == null or search.isEmpty())}" class="text-center py-5 text-muted">
                        <i class="bi bi-inbox" style="font-size: 3rem;"></i>
                        <p class="mt-2">No hay productos disponibles</p>
                    </div>
                    <div th:if="${productos.isEmpty() and search != null and !search.isEmpty()}" class="text-center py-5 text-muted card shadow-sm border border-light" style="border-radius: 16px; background-color: #fafafa;">
                        <div class="card-body">
                            <i class="bi bi-search text-danger mb-3" style="font-size: 3rem; display: block;"></i>
                            <h5 class="fw-bold text-dark">No se encontraron productos con ese criterio</h5>
                            <p class="small text-muted mb-4">No se halló ningún producto que coincida con "<span th:text="${search}" class="fw-semibold text-primary"></span>" en esta categoría.</p>
                            <button type="button" class="btn btn-secondary px-4" onclick="clearSearch()" style="border-radius: 10px; font-weight: 500;">
                                <i class="bi bi-x-circle me-1"></i> Limpiar Búsqueda
                            </button>
                        </div>
                    </div>

                    <!-- Pagination -->
                    <div th:if="${totalPages > 1 and !productos.isEmpty()}" class="mt-4">
                        <nav>
                            <ul class="pagination justify-content-center mb-2">
                                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                    <a class="page-link" th:href="@{/ventas/nueva(page=${currentPage - 1}, size=${pageSize}, categoria=${categoriaActual}, search=${search})}"><i class="bi bi-chevron-left"></i></a>
                                </li>
                                <li th:each="i : ${#numbers.sequence(0, (totalPages > 0 ? totalPages - 1 : 0))}"
                                    th:if="${totalPages > 0 and i >= currentPage - 2 and i <= currentPage + 2}"
                                    th:classappend="${i == currentPage} ? 'active'" class="page-item">
                                    <a class="page-link" th:href="@{/ventas/nueva(page=${i}, size=${pageSize}, categoria=${categoriaActual}, search=${search})}" th:text="${i + 1}"></a>
                                </li>
                                <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                                    <a class="page-link" th:href="@{/ventas/nueva(page=${currentPage + 1}, size=${pageSize}, categoria=${categoriaActual}, search=${search})}"><i class="bi bi-chevron-right"></i></a>
                                </li>
                            </ul>
                        </nav>
                        <div class="text-center small text-muted mt-1">
                            Mostrando <span th:text="${productos.size()}"></span> de <span th:text="${totalItems}"></span> productos
                        </div>
                    </div>
                </div>

                <!-- RIGHT: Cart -->
                <div class="cart-panel">
                    <div class="cart-header">
                        <h5 class="fw-bold mb-0"><i class="bi bi-cart3 me-2"></i> Carrito <span id="cartCount" class="badge bg-secondary ms-1">0</span></h5>
                    </div>
                    <div class="cart-body" id="cartBody">
                        <div id="emptyCart" class="text-center py-5 text-muted">
                            <i class="bi bi-cart-x" style="font-size: 2.5rem;"></i>
                            <p class="mt-2">Agrega productos al carrito</p>
                        </div>
                        <div id="cartItems"></div>
                    </div>
                    <div class="cart-footer">
                        <div class="mb-2">
                            <label class="form-label small fw-bold text-muted">Cédula del Cliente (CC)</label>
                            <input type="text" class="form-control form-control-sm" id="clienteCC" placeholder="Vacío para Consumidor Final" inputmode="numeric" maxlength="13" pattern="[0-9]{1,13}" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold text-muted">Método de Pago</label>
                            <select class="form-select form-select-sm" id="metodoPago">
                                <option value="EFECTIVO">Efectivo</option>
                                <option value="TARJETA">Tarjeta</option>
                                <option value="TRANSFERENCIA">Transferencia</option>
                            </select>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-3 mt-3">
                            <span class="fw-bold fs-5">Total:</span>
                            <span class="fw-bold fs-4" style="color: var(--primary-color);" id="cartTotal">$ 0</span>
                        </div>
                        <button class="btn btn-lfarma w-100 py-2 fw-bold" id="btnPagar" disabled>
                            <i class="bi bi-check-circle me-1"></i> Confirmar Venta
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/sidebar.js"></script>
    <script>
        let cart = [];
        const csrf = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

        // Clear search input and submit
        function clearSearch() {
            const form = document.getElementById('searchForm');
            form.querySelector('input[name="search"]').value = '';
            form.submit();
        }

        // Desplazamiento inteligente al paginar o filtrar
        document.addEventListener("DOMContentLoaded", function () {
            // Guardar indicador en sessionStorage al paginar
            document.querySelectorAll(".page-link, .pagination a").forEach(link => {
                link.addEventListener("click", function () {
                    sessionStorage.setItem("didPaginate", "true");
                });
            });

            document.querySelectorAll("form").forEach(form => {
                form.addEventListener("submit", function () {
                    sessionStorage.setItem("didPaginate", "true");
                });
            });

            // Limpieza automática en botón 'X' nativo de buscadores
            document.querySelectorAll('input[type="search"]').forEach(input => {
                input.addEventListener('search', function() {
                    if (this.value === '') {
                        const form = this.closest('form');
                        if (form) form.submit();
                        else window.location.href = window.location.pathname;
                    }
                });
            });

            // Al cargar, si venimos de paginación o filtro, hacemos scroll suave al listado
            if (sessionStorage.getItem("didPaginate") === "true") {
                sessionStorage.removeItem("didPaginate");
                const targetEl = document.getElementById('productGrid') || document.querySelector('.product-grid');
                if (targetEl) {
                    setTimeout(() => {
                        const targetPosition = targetEl.getBoundingClientRect().top + window.scrollY - 15;
                        window.scrollTo({ top: targetPosition, behavior: 'smooth' });
                    }, 100);
                }
            }
        });

        function addToCart(el) {
            const id = el.dataset.id;
            const nombre = el.dataset.nombre;
            const precio = parseFloat(el.dataset.precio);
            const stock = parseInt(el.dataset.stock);
            const img = el.dataset.img || '';

            const existing = cart.find(i => i.id === id);
            if (existing) {
                if (existing.qty >= stock) { alert('Stock insuficiente'); return; }
                existing.qty++;
            } else {
                cart.push({ id, nombre, precio, stock, img, qty: 1 });
            }
            renderCart();
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            renderCart();
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;
            const newQty = item.qty + delta;
            if (newQty <= 0) { removeFromCart(id); return; }
            if (newQty > item.stock) { alert('Stock insuficiente'); return; }
            item.qty = newQty;
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cartItems');
            const empty = document.getElementById('emptyCart');
            const countBadge = document.getElementById('cartCount');
            const totalEl = document.getElementById('cartTotal');
            const btnPagar = document.getElementById('btnPagar');

            if (cart.length === 0) {
                container.innerHTML = '';
                empty.style.display = 'block';
                countBadge.textContent = '0';
                totalEl.textContent = '$ 0';
                btnPagar.disabled = true;
                return;
            }
            empty.style.display = 'none';
            btnPagar.disabled = false;
            countBadge.textContent = cart.length;

            let total = 0;
            let html = '';
            cart.forEach(item => {
                const subtotal = item.precio * item.qty;
                total += subtotal;
                const imgTag = item.img
                    ? `<img src="${item.img}" class="cart-item-img" alt="">`
                    : `<div class="cart-item-img d-flex align-items-center justify-content-center" style="background:#e8f5e9;"><i class="bi bi-capsule" style="color:var(--primary-color);font-size:0.8rem;"></i></div>`;
                html += `
                <div class="cart-item">
                    ${imgTag}
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.nombre}</div>
                        <div class="cart-item-price">$ ${item.precio.toLocaleString()} x ${item.qty} = <strong>$ ${subtotal.toLocaleString()}</strong></div>
                    </div>
                    <div class="qty-control">
                        <button onclick="changeQty('${item.id}', -1)">−</button>
                        <span>${item.qty}</span>
                        <button onclick="changeQty('${item.id}', 1)">+</button>
                    </div>
                    <button class="btn-remove-item" onclick="removeFromCart('${item.id}')"><i class="bi bi-trash"></i></button>
                </div>`;
            });
            container.innerHTML = html;
            totalEl.textContent = '$ ' + total.toLocaleString();
        }

        document.getElementById('btnPagar').addEventListener('click', function() {
            if (cart.length === 0) return;

            Swal.fire({
                title: '¿Deseas procesar la venta?',
                text: "Esta acción registrará la transacción en el sistema.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#1B4332', // Verde corporativo L-Farma
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Sí, confirmar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    const btn = this;
                    btn.disabled = true;
                    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Procesando...';

                    const body = {
                        clienteCC: document.getElementById('clienteCC').value,
                        metodoPago: document.getElementById('metodoPago').value,
                        detalles: cart.map(i => ({ productoId: i.id, cantidad: i.qty, precioUnitario: i.precio }))
                    };

                    fetch('/ventas/guardar', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', [csrfHeader]: csrf },
                        body: JSON.stringify(body)
                    })
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            cart = [];
                            renderCart();
                            
                            Swal.fire({
                                title: '¡Venta Registrada!',
                                text: 'Venta ' + data.numeroFactura + ' registrada con éxito por un total de $' + Number(data.total).toLocaleString() + '.',
                                icon: 'success',
                                confirmButtonColor: '#1B4332'
                            }).then(() => {
                                window.location.href = '/ventas/' + data.facturaId + '/factura';
                            });
                        } else {
                            Swal.fire({
                                title: 'Error',
                                text: data.message || 'No se pudo procesar la venta.',
                                icon: 'error',
                                confirmButtonColor: '#E63946'
                            });
                            btn.disabled = false;
                            btn.innerHTML = '<i class="bi bi-check-circle me-1"></i> Confirmar Venta';
                        }
                    })
                    .catch(e => {
                        Swal.fire({
                            title: 'Error de Conexión',
                            text: 'No se pudo establecer contacto con el servidor: ' + e.message,
                            icon: 'error',
                            confirmButtonColor: '#E63946'
                        });
                        btn.disabled = false;
                        btn.innerHTML = '<i class="bi bi-check-circle me-1"></i> Confirmar Venta';
                    });
                }
            });
        });
    </script>
</body>
</html>
