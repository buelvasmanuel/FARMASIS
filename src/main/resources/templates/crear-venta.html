<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta - L-Farma</title>
    <!-- CSRF Meta Tags -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" />
    <link rel="stylesheet" href="/css/sidebar.css">
    <script>(function(){try{if(localStorage.getItem('sidebarState')==='closed'){document.documentElement.classList.add('sidebar-preload-collapsed');}}catch(e){}}());</script>
    <style>


        body {
            background-color: #ffffff;
        }

        .summary-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 1.5rem;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .product-row {
            background: #ffffff;
            border-radius: 8px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            position: relative;
            border: 1px solid #e9ecef;
            transition: all 0.2s ease;
        }

        .product-row:hover {
            border-color: #dee2e6;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .remove-product {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 32px;
            height: 32px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 2px 4px rgba(220, 53, 69, 0.2);
        }

        .select2-container--bootstrap-5 .select2-selection {
            border-radius: 0.375rem;
        }
        
        .stock-info {
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }
        
        .total-section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 1rem;
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/sidebar :: sidebar('nueva-venta')}"></div>
    <div th:replace="~{fragments/sidebar :: topbar}"></div>
    <div th:replace="~{fragments/sidebar :: logoutModal}"></div>

    <div class="main-content no-transition" id="mainContent">


        <div class="container-fluid px-4 py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h3 mb-0 fw-bold"><i class="bi bi-cart-plus" style="color: var(--secondary-color);"></i> Punto de Venta</h1>
                <a href="/ventas" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Ver Historial</a>
            </div>

            <div class="row">
                <div class="col-lg-8">
                    <!-- Datos del Cliente -->
                    <div class="summary-card">
                        <h5 class="mb-3 fs-6 fw-bold text-uppercase text-muted"><i class="bi bi-person"></i> Cliente y Pago</h5>
                        <div class="row g-3">
                            <div class="col-md-7">
                                <label class="form-label small fw-medium">Seleccionar Cliente</label>
                                <select id="clienteId" class="form-select select2-cliente">
                                    <option value="" th:selected="true">Consumidor Final</option>
                                    <option th:value="${consumidorFinal.id}" th:text="${consumidorFinal.nombre}"></option>
                                    <option th:each="c : ${clientes}" th:unless="${c.esConsumidorFinal}"
                                        th:value="${c.id}" th:text="${c.nombre + ' (' + c.codigo + ')'}"></option>
                                </select>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label small fw-medium">Método de Pago</label>
                                <select id="metodoPago" class="form-select">
                                    <option value="EFECTIVO">💵 Efectivo</option>
                                    <option value="TARJETA">💳 Tarjeta</option>
                                    <option value="TRANSFERENCIA">🏦 Transferencia</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Listado de Productos -->
                    <div class="summary-card">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0 fs-6 fw-bold text-uppercase text-muted"><i class="bi bi-box-seam"></i> Detalle de Productos</h5>
                            <button type="button" class="btn btn-primary btn-sm rounded-pill px-3" id="agregarProductoBtn">
                                <i class="bi bi-plus-circle"></i> Agregar Fila
                            </button>
                        </div>
                        
                        <div id="productosContainer">
                            <!-- Fila Inicial -->
                            <div class="product-row" data-index="0">
                                <button type="button" class="btn btn-danger btn-sm remove-product" title="Eliminar">
                                    <i class="bi bi-trash"></i>
                                </button>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label small fw-medium">Producto</label>
                                        <select class="form-select producto-select" required>
                                            <option value="">Buscar producto...</option>
                                            <option th:each="p : ${productos}" th:value="${p.id}"
                                                th:text="${p.nombre} + ' - $ ' + ${#numbers.formatDecimal(p.precio, 1, 'POINT', 0, 'COMMA')} + ' (Stock: ' + ${p.cantidad} + ')'"
                                                th:attr="data-precio=${p.precio}, data-stock=${p.cantidad}"></option>
                                        </select>
                                        <div class="stock-info text-muted"></div>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label small fw-medium">Cantidad</label>
                                        <input type="number" class="form-control cantidad-input" value="1" min="1" 
                                               onkeydown="if(['e', 'E', '+', '-', '.'].includes(event.key)) event.preventDefault();">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label small fw-medium">Subtotal</label>
                                        <div class="input-group">
                                            <span class="input-group-text">$</span>
                                            <input type="text" class="form-control subtotal-display bg-light" readonly placeholder="0.00">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Resumen de Venta -->
                <div class="col-lg-4">
                    <div class="summary-card sticky-top" style="top: 2rem;">
                        <h5 class="mb-4 fs-6 fw-bold text-uppercase text-muted"><i class="bi bi-calculator"></i> Resumen de Venta</h5>
                        
                        <div class="total-section mb-4">
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Subtotal:</span>
                                <span class="fw-bold" id="subtotal_text">$ 0</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">IVA (0%):</span>
                                <span class="fw-bold">$ 0</span>
                            </div>
                            <hr class="my-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="h5 mb-0">Total a Pagar:</span>
                                <span class="h4 mb-0 text-success fw-bold" id="total_text">$ 0</span>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-medium">Notas / Observaciones</label>
                            <textarea id="observaciones" class="form-control" placeholder="Opcional..." rows="3"></textarea>
                        </div>

                        <button class="btn btn-success w-100 py-3 fw-bold shadow-sm" id="btnGenerarVenta">
                            <i class="bi bi-check-all fs-5 me-2"></i> CONFIRMAR VENTA
                        </button>
                        
                        <div class="mt-3 text-center">
                            <small class="text-muted"><i class="bi bi-info-circle"></i> Revisa los productos antes de confirmar.</small>
                        </div>
                    </div>
                </div>
            </div>
            </div>
    </div>

    <!-- Modal Success -->
    <div class="modal fade" id="successModal" data-bs-backdrop="static" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-body text-center p-5">
                    <div class="mb-4">
                        <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem;"></i>
                    </div>
                    <h3 class="fw-bold mb-2">¡Venta Realizada!</h3>
                    <p class="text-muted mb-4" id="successMessage"></p>
                    <div class="d-grid gap-2">
                        <a href="/ventas/nueva" class="btn btn-primary py-2">Nueva Venta</a>
                        <a href="/ventas" class="btn btn-outline-secondary py-2">Ver Historial</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="/js/sidebar.js"></script>
    
    <script>
        // Configuración CSRF para Fetch
        const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

        // Formateador COP
        const formateadorCOP = new Intl.NumberFormat('es-CO', {
            style: 'currency',
            currency: 'COP',
            minimumFractionDigits: 0
        });

        let productosSeleccionados = new Set();

        // 1. Inicialización de Plugins
        function initSelect2(element) {
            $(element).select2({
                theme: 'bootstrap-5',
                width: '100%',
                placeholder: 'Buscar producto...',
                dropdownParent: $(element).closest('.product-row') // Para que funcione bien dentro de scrolls o modales
            });
        }

        // 2. Lógica de Cálculos
        function calcularTotales() {
            let totalGeneral = 0;
            document.querySelectorAll('.product-row').forEach(row => {
                const subtotalInput = row.querySelector('.subtotal-display');
                const val = parseFloat(subtotalInput.getAttribute('data-value')) || 0;
                totalGeneral += val;
            });
            
            document.getElementById('subtotal_text').innerText = formateadorCOP.format(totalGeneral);
            document.getElementById('total_text').innerText = formateadorCOP.format(totalGeneral);
        }

        function actualizarFila(row) {
            const select = row.querySelector('.producto-select');
            const cantidadInput = row.querySelector('.cantidad-input');
            const subtotalInput = row.querySelector('.subtotal-display');
            const stockInfo = row.querySelector('.stock-info');
            
            const option = select.options[select.selectedIndex];
            
            if (select.value && cantidadInput.value > 0) {
                const precio = parseFloat(option.getAttribute('data-precio')) || 0;
                const stock = parseInt(option.getAttribute('data-stock')) || 0;
                const cantidad = parseInt(cantidadInput.value) || 0;

                if (cantidad > stock) {
                    cantidadInput.classList.add('is-invalid');
                    stockInfo.innerHTML = `<span class="text-danger fw-bold"><i class="bi bi-exclamation-triangle"></i> Stock insuficiente (${stock} disponibles)</span>`;
                    subtotalInput.value = formateadorCOP.format(0);
                    subtotalInput.setAttribute('data-value', '0');
                } else {
                    cantidadInput.classList.remove('is-invalid');
                    const subtotal = precio * cantidad;
                    subtotalInput.value = formateadorCOP.format(subtotal);
                    subtotalInput.setAttribute('data-value', subtotal);
                    stockInfo.innerHTML = stock < 10 
                        ? `<span class="text-warning fw-medium"><i class="bi bi-hourglass-split"></i> Stock bajo: ${stock}</span>` 
                        : `<span class="text-success small">Stock disponible: ${stock}</span>`;
                }
            } else {
                subtotalInput.value = formateadorCOP.format(0);
                subtotalInput.setAttribute('data-value', '0');
                stockInfo.innerHTML = '';
            }
            calcularTotales();
        }

        // 3. Event Delegation para Filas Dinámicas
        const container = document.getElementById('productosContainer');

        container.addEventListener('input', (e) => {
            const row = e.target.closest('.product-row');
            if (row) actualizarFila(row);
        });

        $(container).on('change', '.producto-select', function() {
            const row = this.closest('.product-row');
            const selectedId = $(this).val();
            
            // Validar si ya existe en otra fila
            let duplicado = false;
            document.querySelectorAll('.producto-select').forEach(s => {
                if (s !== this && $(s).val() === selectedId && selectedId !== "") duplicado = true;
            });

            if (duplicado) {
                alert('Este producto ya ha sido agregado a la lista.');
                $(this).val('').trigger('change.select2');
            } else {
                actualizarFila(row);
            }
        });

        container.addEventListener('click', (e) => {
            const btn = e.target.closest('.remove-product');
            if (btn) {
                const row = btn.closest('.product-row');
                if (document.querySelectorAll('.product-row').length > 1) {
                    // Limpiar Select2 antes de remover
                    const select = $(row).find('.producto-select');
                    if (select.data('select2')) select.select2('destroy');
                    row.remove();
                    calcularTotales();
                } else {
                    alert('Debe haber al menos un producto en la venta.');
                }
            }
        });

        // 4. Agregar Nueva Fila
        document.getElementById('agregarProductoBtn').addEventListener('click', () => {
            const firstRow = container.querySelector('.product-row');
            
            // Destruir select2 antes de clonar para evitar bugs de ID
            const $originalSelect = $(firstRow).find('.producto-select');
            if ($originalSelect.data('select2')) $originalSelect.select2('destroy');
            
            const newRow = firstRow.cloneNode(true);
            
            // Limpiar valores del clon
            newRow.querySelector('.producto-select').value = "";
            newRow.querySelector('.cantidad-input').value = 1;
            newRow.querySelector('.subtotal-display').value = formateadorCOP.format(0);
            newRow.querySelector('.subtotal-display').setAttribute('data-value', '0');
            newRow.querySelector('.stock-info').innerHTML = "";
            newRow.classList.remove('is-invalid');
            
            container.appendChild(newRow);
            
            // Re-inicializar Select2 en ambas filas
            initSelect2($originalSelect);
            initSelect2($(newRow).find('.producto-select'));
            
            // Scroll a la nueva fila
            newRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });

        // 5. Guardar Venta (POST con CSRF)
        document.getElementById('btnGenerarVenta').addEventListener('click', function() {
            const btn = this;
            const clienteId = document.getElementById('clienteId').value;
            const metodoPago = document.getElementById('metodoPago').value;
            const observaciones = document.getElementById('observaciones').value;
            
            const detalles = [];
            let hayError = false;

            document.querySelectorAll('.product-row').forEach(row => {
                const select = row.querySelector('.producto-select');
                const cantidadInput = row.querySelector('.cantidad-input');
                
                if (select.value) {
                    const cantidad = parseInt(cantidadInput.value);
                    const stock = parseInt(select.options[select.selectedIndex].getAttribute('data-stock'));
                    const precio = parseFloat(select.options[select.selectedIndex].getAttribute('data-precio'));

                    if (cantidad > stock || cantidad <= 0) {
                        hayError = true;
                        cantidadInput.classList.add('is-invalid');
                    } else {
                        detalles.push({
                            productoId: select.value,
                            cantidad: cantidad,
                            precioUnitario: precio
                        });
                    }
                }
            });

            if (detalles.length === 0) {
                alert('Por favor, agregue al menos un producto válido.');
                return;
            }

            if (hayError) {
                alert('Por favor, corrija los errores de cantidad o stock.');
                return;
            }

            // Desactivar botón para evitar doble envío
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Procesando...';

            const totalVenta = detalles.reduce((acc, d) => acc + (d.cantidad * d.precioUnitario), 0);

            fetch('/ventas/guardar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    [csrfHeader]: csrfToken
                },
                body: JSON.stringify({
                    clienteId: clienteId || null,
                    metodoPago: metodoPago,
                    observaciones: observaciones,
                    subtotal: totalVenta,
                    total: totalVenta,
                    detalles: detalles
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('successMessage').innerHTML = `
                        Orden: <strong>${data.numeroFactura}</strong><br>
                        Cliente: <strong>${data.cliente}</strong><br>
                        Monto: <strong>${formateadorCOP.format(data.total)}</strong>
                    `;
                    new bootstrap.Modal(document.getElementById('successModal')).show();
                } else {
                    throw new Error(data.message);
                }
            })
            .catch(error => {
                alert('Error al guardar: ' + error.message);
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-check-all fs-5 me-2"></i> CONFIRMAR VENTA';
            });
        });

        // Inicialización inicial
        $(document).ready(function() {
            initSelect2('.producto-select');
            $('.select2-cliente').select2({ theme: 'bootstrap-5', width: '100%' });
        });
    </script>
</body>
</html>
