<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Configurar Email</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4>Configurar Correo Electrónico</h4>
                    </div>
                    <div class="card-body">
                        <p>Para mayor seguridad, necesitamos tu correo electrónico para enviar códigos de verificación.
                        </p>
                        <form th:action="@{/configurar-email}" method="post">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" th:value="${email}"
                                    required>
                            </div>
                            <button type="submit" class="btn btn-primary">Guardar y Continuar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
