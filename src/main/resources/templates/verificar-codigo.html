<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Seguridad - L-Farma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1B4332;
            --primary-light: #2D6A4F;
            --secondary-color: #52B788;
            --accent-color: #74C69D;
            --dark-bg: #081C15;
        }

        * { font-family: 'Inter', sans-serif; }

        body {
            background: linear-gradient(135deg, var(--dark-bg) 0%, var(--primary-color) 40%, var(--primary-light) 70%, var(--secondary-color) 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
        }

        .verify-card {
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .brand-logo .logo-icon {
            font-size: 2.5rem;
            color: var(--secondary-color);
            display: block;
            margin-bottom: 6px;
        }

        .brand-logo h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin: 0;
        }

        .shield-icon {
            font-size: 4rem;
            color: var(--secondary-color);
            display: block;
            text-align: center;
            margin-bottom: 1rem;
        }

        .code-input {
            font-size: 2.2rem;
            text-align: center;
            letter-spacing: 1.2rem;
            font-weight: 700;
            border-radius: 14px;
            padding: 16px;
            border: 2px solid #dee2e6;
            transition: all 0.3s;
        }

        .code-input:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 0.25rem rgba(82, 183, 136, 0.15);
        }

        .btn-verify {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            border: none;
            color: white;
            border-radius: 12px;
            padding: 14px;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .btn-verify:hover {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--secondary-color) 100%);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(27, 67, 50, 0.3);
        }

        .alert { border-radius: 12px; border: none; }

        .footer-text {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #f0f0f0;
        }

        .footer-text small {
            color: #adb5bd;
            font-size: 0.78rem;
        }

        .footer-text strong {
            color: var(--secondary-color);
        }
    </style>
</head>

<body>
    <div class="verify-card">
        <div class="brand-logo">
            <i class="bi bi-heart-pulse logo-icon"></i>
            <h1>L-Farma</h1>
        </div>

        <i class="bi bi-shield-lock shield-icon"></i>
        <h4 class="text-center fw-bold mb-2" style="color: var(--primary-color);">Verificación de Seguridad</h4>
        <p class="text-muted text-center mb-4" style="font-size: 0.9rem;">
            Hemos enviado un código de 4 dígitos a:<br>
            <strong th:text="${email}"></strong>
        </p>

        <div th:if="${error}" class="alert alert-danger">
            <i class="bi bi-exclamation-circle me-1"></i> <span th:text="${error}"></span>
        </div>

        <form th:action="@{/verificar-codigo}" method="post">
            <div class="mb-4">
                <input type="text" name="codigo" class="form-control code-input" maxlength="4"
                    pattern="\d{4}" placeholder="0000" required autofocus
                    oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            </div>
            <button type="submit" class="btn btn-verify w-100">
                <i class="bi bi-check-circle me-2"></i> Verificar y Acceder
            </button>
        </form>

        <div class="text-center mt-3">
            <small class="text-muted">
                ¿No recibiste el código?
                <a href="/verificar-codigo" style="color: var(--secondary-color); font-weight: 600;">Reenviar</a>
            </small>
        </div>

        <div class="footer-text">
            <small>Desarrollado por <strong>Farmasis</strong> © 2026</small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
