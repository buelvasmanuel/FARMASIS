<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis Novedades - FarmaSIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/sidebar.css">
    <script>(function(){try{if(localStorage.getItem('sidebarState')==='closed'){document.documentElement.classList.add('sidebar-preload-collapsed');}}catch(e){}}());</script>
    <style>body{background:#f8fafc;} .table-container{background:white;border-radius:16px;padding:1.5rem;box-shadow:0 2px 12px rgba(0,0,0,0.06);}</style>
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar('novedades')}"></div>
    <div th:replace="~{fragments/sidebar :: topbar}"></div>
    <div th:replace="~{fragments/sidebar :: logoutModal}"></div>

    <div class="main-content no-transition" id="mainContent">
        <div class="container-fluid px-4 py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h3 mb-0 fw-bold"><i class="bi bi-journal-text" style="color:#52B788;"></i> Mis Novedades</h1>
                <a href="/novedades/nueva" class="btn btn-success">
                    <i class="bi bi-plus-circle me-2"></i>Nueva Novedad
                </a>
            </div>

            <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="table-container">
                <div th:if="${#lists.isEmpty(novedades)}" class="text-center py-5 text-muted">
                    <i class="bi bi-journal-x" style="font-size:3rem;"></i>
                    <p class="mt-3">No tienes novedades registradas.</p>
                    <a href="/novedades/nueva" class="btn btn-success mt-2">Reportar mi primera novedad</a>
                </div>
                <table th:unless="${#lists.isEmpty(novedades)}" class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Tipo</th>
                            <th>Fechas</th>
                            <th>Motivo</th>
                            <th>Estado</th>
                            <th>Revisado por</th>
                            <th>Comentario</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="n : ${novedades}">
                            <td><span class="badge bg-info text-dark" th:text="${n.tipo}"></span></td>
                            <td>
                                <div class="small"><i class="bi bi-calendar me-1"></i>
                                    <span th:text="${n.fechaInicio}"></span> →
                                    <span th:text="${n.fechaFin}"></span>
                                </div>
                            </td>
                            <td class="small" th:text="${n.motivo}"></td>
                            <td>
                                <span th:switch="${n.estado.name()}">
                                    <span th:case="'PENDIENTE'" class="badge bg-warning text-dark">⏳ Pendiente</span>
                                    <span th:case="'APROBADO'" class="badge bg-success">✅ Aprobado</span>
                                    <span th:case="'RECHAZADO'" class="badge bg-danger">❌ Rechazado</span>
                                </span>
                            </td>
                            <td class="small" th:text="${n.revisadoPor != null ? n.revisadoPor.username : '—'}"></td>
                            <td class="small text-muted" th:text="${n.comentarioAdmin != null ? n.comentarioAdmin : '—'}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/sidebar.js"></script>
</body>
</html>
