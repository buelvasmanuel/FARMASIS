<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestionar Novedades - FarmaSIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/sidebar.css">
    <script>(function(){try{if(localStorage.getItem('sidebarState')==='closed'){document.documentElement.classList.add('sidebar-preload-collapsed');}}catch(e){}}());</script>
    <style>body{background:#f8fafc;} .card-novedad{background:white;border-radius:12px;padding:1.2rem;border:1px solid #e9ecef;margin-bottom:1rem;transition:box-shadow 0.2s;} .card-novedad:hover{box-shadow:0 4px 16px rgba(0,0,0,0.08);}</style>
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar('novedades')}"></div>
    <div th:replace="~{fragments/sidebar :: topbar}"></div>
    <div th:replace="~{fragments/sidebar :: logoutModal}"></div>
    <!-- Modal rechazar -->
    <div class="modal fade" id="rechazarModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Rechazar Novedad</h5></div>
                <div class="modal-body">
                    <form id="rechazarForm" method="post">

                        <label class="form-label fw-semibold">Motivo del rechazo</label>
                        <textarea name="comentario" class="form-control" rows="3" required placeholder="Explica el motivo..."></textarea>
                        <div class="d-grid mt-3">
                            <button type="submit" class="btn btn-danger">Confirmar Rechazo</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="main-content no-transition" id="mainContent">
        <div class="container-fluid px-4 py-4">
            <h1 class="h3 mb-4 fw-bold"><i class="bi bi-clipboard-check" style="color:#52B788;"></i> Gestión de Novedades</h1>

            <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${successMsg}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMsg}" class="alert alert-warning alert-dismissible fade show">
                <span th:text="${errorMsg}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${#lists.isEmpty(novedades)}" class="text-center py-5 text-muted">
                <i class="bi bi-check-all" style="font-size:3rem;color:#52B788;"></i>
                <p class="mt-3">No hay novedades registradas.</p>
            </div>

            <div th:each="n : ${novedades}" class="card-novedad">
                <div class="row align-items-center">
                    <div class="col-md-5">
                        <div class="fw-bold" th:text="${n.usuario.username}"></div>
                        <div class="small text-muted">
                            <span th:text="${n.usuario.nombre}"></span> <span th:text="${n.usuario.apellido}"></span>
                        </div>
                        <span class="badge bg-info text-dark mt-1" th:text="${n.tipo}"></span>
                    </div>
                    <div class="col-md-3">
                        <div class="small"><i class="bi bi-calendar me-1"></i>
                            <span th:text="${n.fechaInicio}"></span> →
                            <span th:text="${n.fechaFin}"></span>
                        </div>
                        <div class="small text-muted mt-1" th:text="${n.motivo}"></div>
                    </div>
                    <div class="col-md-2 text-center">
                        <span th:switch="${n.estado.name()}">
                            <span th:case="'PENDIENTE'" class="badge bg-warning text-dark fs-6">⏳ Pendiente</span>
                            <span th:case="'APROBADO'" class="badge bg-success fs-6">✅ Aprobado</span>
                            <span th:case="'RECHAZADO'" class="badge bg-danger fs-6">❌ Rechazado</span>
                        </span>
                    </div>
                    <div class="col-md-2 text-end" th:if="${n.estado.name() == 'PENDIENTE'}">
                        <form th:action="@{'/admin/novedades/' + ${n.id} + '/aprobar'}" method="post" class="d-inline">

                            <button class="btn btn-success btn-sm me-1" title="Aprobar">
                                <i class="bi bi-check-lg"></i>
                            </button>
                        </form>
                        <button class="btn btn-danger btn-sm" title="Rechazar"
                                th:onclick="'openRechazar(' + ${n.id} + ')'">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/sidebar.js"></script>
    <script>
        function openRechazar(id) {
            document.getElementById('rechazarForm').action = '/admin/novedades/' + id + '/rechazar';
            new bootstrap.Modal(document.getElementById('rechazarModal')).show();
        }
    </script>
</body>
</html>
