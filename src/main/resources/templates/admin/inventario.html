<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - L-Farma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/sidebar.css">
    <script>(function(){try{if(localStorage.getItem('sidebarState')==='closed'){document.documentElement.classList.add('sidebar-preload-collapsed');}}catch(e){}}());</script>
    <style>
        html.sidebar-preload-collapsed .sidebar { width: 70px; min-width: 70px; }
        html.sidebar-preload-collapsed .sidebar .sidebar-text,
        html.sidebar-preload-collapsed .sidebar .nav-label,
        html.sidebar-preload-collapsed .sidebar .logo-text,
        html.sidebar-preload-collapsed .sidebar .sidebar-footer { display: none; }
        html.sidebar-preload-collapsed .main-content { margin-left: 70px; }
        * { font-family: 'Inter', sans-serif; }
        body { background-color: #ffffff; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar('inventario')}"></div>
    <div th:replace="~{fragments/sidebar :: topbar}"></div>
    <div th:replace="~{fragments/sidebar :: logoutModal}"></div>

    <div class="main-content no-transition" id="mainContent">
        <main class="content-wrapper container-fluid px-4 py-3">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="fw-bold mb-0"><i class="bi bi-box-seam me-2" style="color: var(--secondary-color);"></i> Inventario</h1>
                <span class="badge fs-6" style="background: var(--primary-color);" th:text="'Total: ' + ${productos.size()}">Total: 0</span>
            </div>

            <div class="table-container">
                <div class="table-responsive">
                    <table class="table table-hover align-middle" id="inventarioTable">
                        <thead class="table-dark">
                            <tr>
                                <th>Código</th>
                                <th>Producto</th>
                                <th>Categoría</th>
                                <th>Stock</th>
                                <th>Precio</th>
                                <th>Vencimiento</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${productos}">
                                <td><span class="badge bg-light text-dark" th:text="${p.codigo}">0001</span></td>
                                <td class="fw-bold" th:text="${p.nombre}">Producto</td>
                                <td th:text="${p.categoria != null ? p.categoria : '—'}">—</td>
                                <td>
                                    <span th:if="${p.cantidad != null and p.cantidad <= 5}" class="text-danger fw-bold" th:text="${p.cantidad}">0</span>
                                    <span th:if="${p.cantidad != null and p.cantidad > 5 and p.cantidad < 15}" class="text-warning fw-bold" th:text="${p.cantidad}">10</span>
                                    <span th:if="${p.cantidad != null and p.cantidad >= 15}" class="text-success" th:text="${p.cantidad}">50</span>
                                    <span th:if="${p.cantidad == null}">0</span>
                                    <i th:if="${p.cantidad != null and p.cantidad <= 5}" class="bi bi-exclamation-triangle text-danger ms-1"></i>
                                </td>
                                <td th:text="'$ ' + ${p.precio != null ? #numbers.formatDecimal(p.precio, 1, 'POINT', 0, 'COMMA') : '0'}">$ 0</td>
                                <td th:text="${p.fechaVencimiento != null ? #temporals.format(p.fechaVencimiento, 'dd/MM/yyyy') : '—'}">—</td>
                            </tr>
                        </tbody>
                    </table>
                    <div th:if="${#lists.isEmpty(productos)}" class="text-center py-5 text-muted">
                        <i class="bi bi-inbox fs-1"></i>
                        <p class="mt-2">No hay productos registrados</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/sidebar.js"></script>
</body>
</html>
