<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Ventas - L-Farma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/sidebar.css">
    <script>(function(){try{if(localStorage.getItem('sidebarState')==='closed'){document.documentElement.classList.add('sidebar-preload-collapsed');}}catch(e){}}());</script>
    <style>
        html.sidebar-preload-collapsed .sidebar { width: 70px; min-width: 70px; }
        html.sidebar-preload-collapsed .sidebar .sidebar-text,
        html.sidebar-preload-collapsed .sidebar .nav-label,
        html.sidebar-preload-collapsed .sidebar .logo-text,
        html.sidebar-preload-collapsed .sidebar .sidebar-footer { display: none; }
        html.sidebar-preload-collapsed .main-content { margin-left: 70px; }
        * { font-family: 'Inter', sans-serif; }
        body { background-color: #ffffff; }
        .table-container { background: white; border-radius: 12px; padding: 24px; box-shadow: var(--card-shadow); }
        .stat-mini { background: white; border-radius: 12px; padding: 16px 20px; box-shadow: var(--card-shadow); text-align: center; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar('ventas')}"></div>
    <div th:replace="~{fragments/sidebar :: topbar}"></div>
    <div th:replace="~{fragments/sidebar :: logoutModal}"></div>

    <div class="main-content no-transition" id="mainContent">
        <main class="content-wrapper container-fluid px-4 py-3">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="fw-bold mb-0"><i class="bi bi-receipt me-2" style="color: var(--secondary-color);"></i> Historial de Ventas</h1>
            </div>

            <!-- Summary -->
            <div class="row mb-4">
                <div class="col-md-6 mb-3">
                    <div class="stat-mini">
                        <small class="text-muted d-block">Ventas Hoy</small>
                        <h3 class="fw-bold mb-0" style="color: var(--primary-color);" 
                            th:text="'$ ' + ${#numbers.formatDecimal(ventasDelDia, 1, 'POINT', 0, 'COMMA')}">$ 0</h3>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <div class="stat-mini">
                        <small class="text-muted d-block">Transacciones Hoy</small>
                        <h3 class="fw-bold mb-0" style="color: var(--primary-color);" th:text="${cantidadVentasDelDia}">0</h3>
                    </div>
                </div>
            </div>

            <div class="table-container">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th># Factura</th>
                                <th>Fecha</th>
                                <th>Cliente</th>
                                <th>Total</th>
                                <th>Método Pago</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="v : ${ventas}">
                                <td><span class="badge" style="background: var(--primary-color);" th:text="${v.numeroFactura}">FAC-000</span></td>
                                <td th:text="${#temporals.format(v.fecha, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                                <td th:text="${v.clienteNombre}">Cliente</td>
                                <td class="fw-bold" th:text="'$ ' + ${#numbers.formatDecimal(v.total, 1, 'POINT', 0, 'COMMA')}">$ 0</td>
                                <td><span class="badge bg-light text-dark" th:text="${v.metodoPago}">EFECTIVO</span></td>
                                <td>
                                    <a th:href="@{'/ventas/' + ${v.id} + '/factura'}" class="btn btn-sm btn-outline-lfarma" title="Ver Ticket">
                                        <i class="bi bi-printer"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div th:if="${#lists.isEmpty(ventas)}" class="text-center py-5 text-muted">
                        <i class="bi bi-inbox fs-1"></i>
                        <p>No hay ventas registradas</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/sidebar.js"></script>
</body>
</html>
