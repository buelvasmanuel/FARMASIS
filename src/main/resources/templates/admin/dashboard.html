<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Panel Admin - L-Farma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/sidebar.css">
    <script>(function(){try{if(localStorage.getItem('sidebarState')==='closed'){document.documentElement.classList.add('sidebar-preload-collapsed');}}catch(e){}}());</script>
    <style>

        body { background-color: #ffffff; }
    </style>
</head>

<body>
    <div th:replace="~{fragments/sidebar :: sidebar('dashboard')}"></div>
    <div th:replace="~{fragments/sidebar :: topbar}"></div>
    <div th:replace="~{fragments/sidebar :: logoutModal}"></div>

    <div class="main-content no-transition" id="mainContent">
        <div class="container-fluid px-4 py-4">
            <!-- Welcome Banner -->
            <div class="welcome-card">
                <h2><i class="bi bi-shield-lock me-2"></i> <span th:text="${titulo}"></span></h2>
                <p class="mb-0">Gestiona el inventario, proveedores y ventas del sistema L-Farma.</p>
            </div>

            <!-- Stats Cards -->
            <div class="row mb-4">
                <div class="col-md-4 mb-3">
                    <div class="stat-card">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted">Ventas del Día</h6>
                                <h2 class="mb-0" th:text="'$ ' + ${#numbers.formatDecimal(ventasDelDia, 1, 'POINT', 0, 'COMMA')}">$ 0</h2>
                                <small class="text-muted" th:text="${cantidadVentasDelDia} + ' transacciones'">0 transacciones</small>
                            </div>
                            <div class="stat-icon"><i class="bi bi-cash-stack"></i></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div class="stat-card">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted">Total Productos</h6>
                                <h2 class="mb-0" th:text="${totalProductos}">0</h2>
                            </div>
                            <div class="stat-icon"><i class="bi bi-box-seam"></i></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div class="stat-card">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted">Proveedores</h6>
                                <h2 class="mb-0" th:text="${totalProveedores}">0</h2>
                            </div>
                            <div class="stat-icon"><i class="bi bi-truck"></i></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <h4 class="mb-3 fw-bold">Acciones Rápidas</h4>
            <div class="row mb-4">
                <div class="col-md-3 mb-3">
                    <a href="/admin/inventario" class="quick-action">
                        <i class="bi bi-box-seam"></i>
                        <strong>Inventario</strong>
                        <small class="text-muted d-block">Gestionar productos</small>
                    </a>
                </div>
                <div class="col-md-3 mb-3">
                    <a href="/admin/proveedores" class="quick-action">
                        <i class="bi bi-truck"></i>
                        <strong>Proveedores</strong>
                        <small class="text-muted d-block">Ver proveedores</small>
                    </a>
                </div>
                <div class="col-md-3 mb-3">
                    <a href="/ventas/nueva" class="quick-action">
                        <i class="bi bi-cart-plus"></i>
                        <strong>Nueva Venta</strong>
                        <small class="text-muted d-block">Punto de venta</small>
                    </a>
                </div>
                <div class="col-md-3 mb-3">
                    <a href="/admin/ventas" class="quick-action">
                        <i class="bi bi-receipt"></i>
                        <strong>Historial Ventas</strong>
                        <small class="text-muted d-block">Ver y anular</small>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/sidebar.js"></script>
</body>

</html>
