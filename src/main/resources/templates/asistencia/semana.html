<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registros del Mes - FarmaSIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/sidebar.css">
    <script>(function(){try{if(localStorage.getItem('sidebarState')==='closed'){document.documentElement.classList.add('sidebar-preload-collapsed');}}catch(e){}}());</script>
    <style>
        body { background-color: #f8fafc; }
        .table-container { background: white; border-radius: 16px; padding: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    </style>
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar('asistencia')}"></div>
    <div th:replace="~{fragments/sidebar :: topbar}"></div>
    <div th:replace="~{fragments/sidebar :: logoutModal}"></div>

    <div class="main-content no-transition" id="mainContent">
        <div class="container-fluid px-4 py-4">
            <div class="d-flex align-items-center gap-3 mb-4">
                <a href="/asistencia/calendario" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <h1 class="h3 mb-0 fw-bold">
                    <i class="bi bi-calendar-week" style="color:#52B788;"></i>
                    <span th:text="${mes + ' ' + anio}"></span>
                </h1>
            </div>

            <div class="table-container">
                <div th:if="${#lists.isEmpty(registros)}" class="text-center py-5 text-muted">
                    <i class="bi bi-calendar-x" style="font-size:3rem;"></i>
                    <p class="mt-3">No hay registros de asistencia para este mes.</p>
                </div>
                <table th:unless="${#lists.isEmpty(registros)}" class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Fecha</th>
                            <th>Día</th>
                            <th>Hora Entrada</th>
                            <th>Hora Salida</th>
                            <th>Horas Trabajadas</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${registros}">
                            <td th:text="${#temporals.format(r.fecha, 'dd/MM/yyyy')}"></td>
                            <td th:text="${#temporals.format(r.fecha, 'EEEE')}"></td>
                            <td>
                                <span class="badge bg-success" th:text="${#temporals.format(r.horaEntrada, 'HH:mm')}"></span>
                            </td>
                            <td>
                                <span th:if="${r.horaSalida != null}" class="badge bg-secondary"
                                      th:text="${#temporals.format(r.horaSalida, 'HH:mm')}"></span>
                                <span th:unless="${r.horaSalida != null}" class="badge bg-warning text-dark">En curso</span>
                            </td>
                            <td th:text="${r.horasTrabajadas}"></td>
                            <td>
                                <span th:if="${r.horaSalida != null}" class="badge bg-success">Completo</span>
                                <span th:unless="${r.horaSalida != null}" class="badge bg-warning text-dark">Abierto</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/sidebar.js"></script>
</body>
</html>
