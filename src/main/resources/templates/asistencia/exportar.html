<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Exportar Asistencia Excel - FarmaSIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/sidebar.css">
    <script>(function(){try{if(localStorage.getItem('sidebarState')==='closed'){document.documentElement.classList.add('sidebar-preload-collapsed');}}catch(e){}}());</script>
    <style>body{background:#f8fafc;} .export-card{background:white;border-radius:16px;padding:2rem;box-shadow:0 2px 12px rgba(0,0,0,0.06);max-width:550px;}</style>
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar('asistencia')}"></div>
    <div th:replace="~{fragments/sidebar :: topbar}"></div>
    <div th:replace="~{fragments/sidebar :: logoutModal}"></div>

    <div class="main-content no-transition" id="mainContent">
        <div class="container-fluid px-4 py-4">
            <h1 class="h3 mb-4 fw-bold">
                <i class="bi bi-file-earmark-excel" style="color:#52B788;"></i> Exportar Asistencia a Excel
            </h1>

            <div class="export-card">
                <form th:action="@{/owner/asistencia/exportar}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Rango de fechas</label>
                        <div class="row g-3">
                            <div class="col-6">
                                <label class="form-label small text-muted">Desde</label>
                                <input type="date" name="desde" class="form-control"
                                       th:value="${hoy.minusMonths(1)}" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label small text-muted">Hasta</label>
                                <input type="date" name="hasta" class="form-control"
                                       th:value="${hoy}" required>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Filtrar por Rol</label>
                        <div class="d-flex gap-3 flex-wrap">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="roles"
                                       value="ROLE_EMPLEADO" id="chkEmpleado" checked>
                                <label class="form-check-label" for="chkEmpleado">👷 Empleados</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="roles"
                                       value="ROLE_ADMIN" id="chkAdmin">
                                <label class="form-check-label" for="chkAdmin">🛡 Admins</label>
                            </div>
                        </div>
                        <small class="text-muted">Si no seleccionas ninguno, se exportan todos los roles.</small>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-3 fw-bold">
                        <i class="bi bi-download me-2"></i>Descargar Excel
                    </button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/sidebar.js"></script>
</body>
</html>
