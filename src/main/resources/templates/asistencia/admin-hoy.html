<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Asistencia de Hoy - FarmaSIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/sidebar.css">
    <script>(function(){try{if(localStorage.getItem('sidebarState')==='closed'){document.documentElement.classList.add('sidebar-preload-collapsed');}}catch(e){}}());</script>
    <style>body { background-color: #f8fafc; } .table-container { background:white; border-radius:16px; padding:1.5rem; box-shadow:0 2px 12px rgba(0,0,0,0.06); }</style>
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar('asistencia')}"></div>
    <div th:replace="~{fragments/sidebar :: topbar}"></div>
    <div th:replace="~{fragments/sidebar :: logoutModal}"></div>

    <div class="main-content no-transition" id="mainContent">
        <div class="container-fluid px-4 py-4">
            <h1 class="h3 mb-4 fw-bold">
                <i class="bi bi-people" style="color:#52B788;"></i> Asistencia de Hoy
                <small class="fs-6 text-muted ms-2" th:text="${#temporals.format(fecha, 'dd/MM/yyyy')}"></small>
            </h1>

            <div class="row mb-4">
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm text-center py-3">
                        <div class="h2 fw-bold text-success" th:text="${totalRegistros}">0</div>
                        <div class="text-muted small">Registros del día</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm text-center py-3">
                        <div class="h2 fw-bold text-warning" th:text="${totalAbiertos}">0</div>
                        <div class="text-muted small">Entradas abiertas</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm text-center py-3">
                        <div class="h2 fw-bold text-primary" th:text="${totalCompletos}">0</div>
                        <div class="text-muted small">Jornadas completas</div>
                    </div>
                </div>
            </div>

            <div class="table-container">
                <div th:if="${#lists.isEmpty(registros)}" class="text-center py-5 text-muted">
                    <i class="bi bi-inbox" style="font-size:3rem;"></i>
                    <p class="mt-3">No hay registros de asistencia para hoy.</p>
                </div>
                <table th:unless="${#lists.isEmpty(registros)}" class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Usuario</th>
                            <th>Rol</th>
                            <th>Hora Entrada</th>
                            <th>Hora Salida</th>
                            <th>Horas</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${registros}">
                            <td>
                                <strong th:text="${r.usuario.username}"></strong>
                                <div class="small text-muted">
                                    <span th:text="${r.usuario.nombre}"></span> <span th:text="${r.usuario.apellido}"></span>
                                </div>
                            </td>
                            <td><span class="badge bg-secondary" th:text="${r.usuario.rol != null ? r.usuario.rol.replace('ROLE_', '') : ''}"></span></td>
                            <td><span class="badge bg-success" th:text="${#temporals.format(r.horaEntrada, 'HH:mm')}"></span></td>
                            <td>
                                <span th:if="${r.horaSalida != null}" class="badge bg-dark"
                                      th:text="${#temporals.format(r.horaSalida, 'HH:mm')}"></span>
                                <span th:unless="${r.horaSalida != null}" class="badge bg-warning text-dark">⏳ En curso</span>
                            </td>
                            <td th:text="${r.horasTrabajadas}"></td>
                            <td>
                                <span th:if="${r.horaSalida != null}" class="badge bg-success">✓ Completo</span>
                                <span th:unless="${r.horaSalida != null}" class="badge bg-warning text-dark">Activo</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/sidebar.js"></script>
</body>
</html>
