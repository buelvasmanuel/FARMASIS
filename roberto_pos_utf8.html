<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta - L-Farma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/sidebar.css">
    <script>(function(){try{if(localStorage.getItem('sidebarState')==='closed'){document.documentElement.classList.add('sidebar-preload-collapsed');}}catch(e){}}());</script>
    <style>
        html.sidebar-preload-collapsed .sidebar { width: 70px; min-width: 70px; }
        html.sidebar-preload-collapsed .sidebar .sidebar-text,
        html.sidebar-preload-collapsed .sidebar .nav-label,
        html.sidebar-preload-collapsed .sidebar .logo-text,
        html.sidebar-preload-collapsed .sidebar .sidebar-footer { display: none; }
        html.sidebar-preload-collapsed .main-content { margin-left: 70px; }
        * { font-family: 'Inter', sans-serif; }
        body { background-color: #ffffff; }

        .pos-container { display: flex; gap: 20px; min-height: calc(100vh - 130px); }
        .pos-products { flex: 1; }
        .pos-cart { width: 380px; flex-shrink: 0; }

        .product-search { margin-bottom: 20px; }
        .product-search .form-control { border-radius: 12px; padding: 12px 16px; }
        .product-search .form-control:focus { border-color: var(--secondary-color); box-shadow: 0 0 0 0.25rem rgba(82, 183, 136, 0.15); }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
        .product-item {
            background: white; border-radius: 12px; padding: 16px; text-align: center;
            cursor: pointer; transition: all 0.3s; border: 2px solid transparent;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .product-item:hover { border-color: var(--secondary-color); transform: translateY(-2px); box-shadow: var(--card-hover-shadow); }
        .product-item .product-img {
            width: 100%; height: 120px; object-fit: contain; margin-bottom: 10px;
            background: #f8fafc; border-radius: 8px; padding: 8px;
        }
        .product-item .product-code { font-size: 0.7rem; color: var(--text-muted); }
        .product-item .product-name { font-weight: 600; font-size: 0.9rem; margin: 6px 0; color: var(--text-primary); }
        .product-item .product-price { color: var(--primary-color); font-weight: 700; font-size: 1.1rem; }
        .product-item .product-stock { font-size: 0.75rem; color: var(--text-muted); }
        .product-item.out-of-stock { opacity: 0.5; pointer-events: none; }

        .cart-panel {
            background: white; border-radius: 16px; padding: 20px; height: fit-content;
            box-shadow: var(--card-shadow); position: sticky; top: 20px;
        }
        .cart-title { font-weight: 700; font-size: 1.1rem; color: var(--primary-color); margin-bottom: 16px; }
        .cart-items { max-height: 350px; overflow-y: auto; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
        .cart-item:last-child { border-bottom: none; }
        .cart-item-name { font-weight: 500; font-size: 0.85rem; }
        .cart-item-qty { display: flex; align-items: center; gap: 8px; }
        .cart-item-qty button { width: 28px; height: 28px; border-radius: 6px; border: 1px solid #dee2e6; background: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .cart-item-qty button:hover { background: var(--accent-light); }
        .cart-item-remove { color: var(--danger-color); cursor: pointer; font-size: 1rem; }

        .cart-total { border-top: 2px solid var(--primary-color); padding-top: 16px; margin-top: 16px; }
        .cart-total-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .cart-total-final { font-size: 1.3rem; font-weight: 700; color: var(--primary-color); }

        .btn-pay {
            width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: 700;
            font-size: 1rem; color: white; cursor: pointer; transition: all 0.3s;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        }
        .btn-pay:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(27, 67, 50, 0.3); }
        .btn-pay:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

        .empty-cart { text-align: center; padding: 30px 0; color: var(--text-muted); }
        .empty-cart i { font-size: 2.5rem; margin-bottom: 8px; display: block; }

        @media (max-width: 992px) {
            .pos-container { flex-direction: column; }
            .pos-cart { width: 100%; }
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar('pos')}"></div>
    <div th:replace="~{fragments/sidebar :: topbar}"></div>
    <div th:replace="~{fragments/sidebar :: logoutModal}"></div>

    <div class="main-content no-transition" id="mainContent">
        <main class="content-wrapper container-fluid px-4 py-3">
            <h1 class="fw-bold mb-4"><i class="bi bi-cart-plus me-2" style="color: var(--secondary-color);"></i> Punto de Venta</h1>

            <div class="pos-container">
                <!-- Products Section -->
                <div class="pos-products">
                    <div class="product-search">
                        <input type="text" class="form-control" id="searchProducts" placeholder="­ƒöì Buscar producto por nombre o c├│digo...">
                    </div>
                    <div class="product-grid" id="productGrid">
                        <div th:each="p : ${productos}" 
                             th:class="${p.cantidad <= 0 ? 'product-item out-of-stock' : 'product-item'}"
                             th:data-id="${p.id}" th:data-name="${p.nombre}" th:data-price="${p.precio}" 
                             th:data-stock="${p.cantidad}" th:data-code="${p.codigo}"
                             onclick="addToCart(this)">
                            <img th:src="${p.imagenUrl != null and !p.imagenUrl.isEmpty() ? p.imagenUrl : 'https://via.placeholder.com/150?text=Sin+Imagen'}" 
                                 class="product-img" alt="Imagen producto">
                            <span class="product-code" th:text="'Cod: ' + ${p.codigo}">Cod: 0001</span>
                            <div class="product-name" th:text="${p.nombre}">Producto</div>
                            <div class="product-price" th:text="'$ ' + ${#numbers.formatDecimal(p.precio, 1, 'POINT', 0, 'COMMA')}">$ 0</div>
                            <div class="product-stock">
                                <span th:if="${p.cantidad > 0}" th:text="'Stock: ' + ${p.cantidad}">Stock: 0</span>
                                <span th:if="${p.cantidad <= 0}" class="text-danger">Agotado</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Cart Section -->
                <div class="pos-cart">
                    <div class="cart-panel">
                        <div class="cart-title"><i class="bi bi-cart3 me-2"></i> Carrito de Venta</div>

                        <div class="mb-3">
                            <label class="form-label" style="font-size: 0.8rem; font-weight: 600;">Cliente</label>
                            <select class="form-select form-select-sm" id="clienteSelect" style="border-radius: 10px;">
                                <option th:if="${consumidorFinal != null}" th:value="${consumidorFinal.id}" th:text="${consumidorFinal.nombre}" selected>Consumidor Final</option>
                                <option th:each="c : ${clientes}" th:if="${consumidorFinal == null || !c.id.equals(consumidorFinal.id)}" th:value="${c.id}" th:text="${c.nombre}">Cliente</option>
                            </select>
                        </div>

                        <div class="cart-items" id="cartItems">
                            <div class="empty-cart" id="emptyCart">
                                <i class="bi bi-cart-x"></i>
                                <p>Carrito vac├¡o</p>
                            </div>
                        </div>

                        <div class="cart-total" id="cartTotal" style="display: none;">
                            <div class="cart-total-row">
                                <span>Subtotal</span>
                                <span id="subtotalDisplay">$ 0</span>
                            </div>
                            <div class="cart-total-row cart-total-final">
                                <span>TOTAL</span>
                                <span id="totalDisplay">$ 0</span>
                            </div>
                        </div>

                        <button class="btn-pay mt-3" id="btnPay" disabled onclick="procesarVenta()">
                            <i class="bi bi-check-circle me-2"></i> Procesar Venta
                        </button>
                    </div>
                </div>
            </div>
            </main>
    </div>

    <!-- Success Modal -->
    <div class="modal fade" id="successModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0" style="border-radius: 16px;">
                <div class="modal-body text-center py-4">
                    <i class="bi bi-check-circle" style="font-size: 4rem; color: var(--secondary-color);"></i>
                    <h5 class="mt-3 fw-bold">┬íVenta Exitosa!</h5>
                    <p class="text-muted" id="successMessage">Venta registrada correctamente</p>
                    <div class="d-grid gap-2">
                        <a href="#" id="btnVerTicket" class="btn btn-lfarma">
                            <i class="bi bi-printer me-1"></i> Ver Ticket
                        </a>
                        <button class="btn btn-outline-secondary" data-bs-dismiss="modal" onclick="resetCart()">Nueva Venta</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/sidebar.js"></script>
    <script>
        let cart = [];

        // Search filter
        document.getElementById('searchProducts').addEventListener('input', function() {
            const query = this.value.toLowerCase();
            document.querySelectorAll('.product-item').forEach(item => {
                const name = item.dataset.name.toLowerCase();
                const code = item.dataset.code.toLowerCase();
                item.style.display = (name.includes(query) || code.includes(query)) ? '' : 'none';
            });
        });

        function addToCart(el) {
            const id = el.dataset.id;
            const name = el.dataset.name;
            const price = parseFloat(el.dataset.price);
            const stock = parseInt(el.dataset.stock);

            const existing = cart.find(i => i.id === id);
            if (existing) {
                if (existing.qty >= stock) { alert('Stock insuficiente'); return; }
                existing.qty++;
            } else {
                cart.push({ id, name, price, stock, qty: 1 });
            }
            renderCart();
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            renderCart();
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) { removeFromCart(id); return; }
            if (item.qty > item.stock) { item.qty = item.stock; alert('Stock m├íximo alcanzado'); }
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cartItems');
            const emptyCart = document.getElementById('emptyCart');
            const cartTotal = document.getElementById('cartTotal');
            const btnPay = document.getElementById('btnPay');

            if (cart.length === 0) {
                container.innerHTML = '<div class="empty-cart" id="emptyCart"><i class="bi bi-cart-x"></i><p>Carrito vac├¡o</p></div>';
                cartTotal.style.display = 'none';
                btnPay.disabled = true;
                return;
            }

            let html = '';
            let total = 0;
            cart.forEach(item => {
                const subtotal = item.price * item.qty;
                total += subtotal;
                html += `<div class="cart-item">
                    <div>
                        <div class="cart-item-name">${item.name}</div>
                        <small class="text-muted">$ ${item.price.toLocaleString()}</small>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <div class="cart-item-qty">
                            <button onclick="changeQty('${item.id}', -1)">ÔêÆ</button>
                            <span>${item.qty}</span>
                            <button onclick="changeQty('${item.id}', 1)">+</button>
                        </div>
                        <span class="fw-bold" style="min-width: 70px; text-align: right;">$ ${subtotal.toLocaleString()}</span>
                        <i class="bi bi-trash cart-item-remove" onclick="removeFromCart('${item.id}')"></i>
                    </div>
                </div>`;
            });

            container.innerHTML = html;
            cartTotal.style.display = 'block';
            document.getElementById('subtotalDisplay').textContent = '$ ' + total.toLocaleString();
            document.getElementById('totalDisplay').textContent = '$ ' + total.toLocaleString();
            btnPay.disabled = false;
        }

        function procesarVenta() {
            if (cart.length === 0) return;
            const btnPay = document.getElementById('btnPay');
            btnPay.disabled = true;
            btnPay.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Procesando...';

            const payload = {
                clienteId: document.getElementById('clienteSelect').value,
                metodoPago: 'EFECTIVO',
                observaciones: '',
                detalles: cart.map(i => ({ productoId: i.id, cantidad: i.qty, precioUnitario: i.price }))
            };

            fetch('/ventas/guardar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('successMessage').textContent = 
                        `Factura ${data.numeroFactura} ÔÇö Total: $ ${parseFloat(data.total).toLocaleString()}`;
                    document.getElementById('btnVerTicket').href = `/ventas/${data.facturaId}/factura`;
                    new bootstrap.Modal(document.getElementById('successModal')).show();
                } else {
                    alert('Error: ' + data.message);
                }
            })
            .catch(e => alert('Error de conexi├│n: ' + e.message))
            .finally(() => {
                btnPay.disabled = false;
                btnPay.innerHTML = '<i class="bi bi-check-circle me-2"></i> Procesar Venta';
            });
        }

        function resetCart() {
            cart = [];
            renderCart();
        }
    </script>
</body>
</html>
